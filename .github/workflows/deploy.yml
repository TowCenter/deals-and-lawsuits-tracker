name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo-app/package-lock.json

      # The site compiles src/lib straight from source with its own toolchain,
      # so the root package's dependencies are not needed to build or deploy.
      - name: Install dependencies
        run: npm ci --prefix demo-app

      # GitHub Pages serves a project site from /<repo-name>/, while the production
      # site sits at /ai-deals-lawsuits. Asset URLs are absolute, so this preview
      # build needs its own base path or every asset 404s.
      - name: Build SvelteKit app
        run: npm run build --prefix demo-app
        env:
          NODE_ENV: production
          BASE_PATH: /deals-and-lawsuits-tracker

      - name: Add .nojekyll
        run: touch demo-app/build/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo-app/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
